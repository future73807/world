<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高保真 · 世界创建 · 桌面</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  .create { width: 880px; padding: 34px 36px 28px; }
  .create .head { display: flex; align-items: baseline; gap: 14px; }
  .create .head h1 { font-size: 27px; letter-spacing: .16em; }
  .create .head span { font-size: 12px; color: var(--text-low); letter-spacing: .06em; }
  .create .grid { margin-top: 26px; display: grid; grid-template-columns: 292px 1fr; gap: 28px; }

  .inspire { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--ink-line); background: linear-gradient(170deg, rgba(24,52,60,.6), rgba(10,26,32,.4)); }
  .inspire svg { width: 100%; height: 168px; display: block; }
  .inspire .body { padding: 16px 18px 18px; }
  .inspire .body h3 { font-family: var(--font-title); font-size: 18px; letter-spacing: .1em; }
  .inspire .body p { margin-top: 8px; font-size: 12px; line-height: 1.8; color: var(--text-mid); }
  .palette { margin-top: 14px; display: flex; gap: 7px; }
  .palette i { width: 30px; height: 16px; border-radius: 4px; border: 1px solid rgba(226,236,228,.16); }
  .seed { margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-low); }
  .seed code { font-family: Consolas, monospace; color: var(--text-mid); letter-spacing: .04em; }
  .seed button { margin-left: auto; width: 28px; height: 28px; }
  .seed button .icon { width: 15px; height: 15px; }

  .form label.lbl { display: block; font-size: 11px; letter-spacing: .18em; color: var(--text-low); margin-bottom: 10px; }
  .input { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--ink-line-strong); background: rgba(8,22,28,.42); }
  .input .icon { width: 18px; height: 18px; color: var(--gold); }
  .input span { font-size: 13.5px; color: var(--text-hi); letter-spacing: .02em; }
  .input .caret { width: 1px; height: 18px; background: var(--accent); }

  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .preset { padding: 13px 12px; border-radius: var(--r-md); border: 1px solid var(--ink-line); background: rgba(10,26,32,.32); cursor: pointer; text-align: left; color: var(--text-mid); }
  .preset b { display: block; font-family: var(--font-title); font-size: 14.5px; letter-spacing: .08em; color: var(--text-hi); }
  .preset small { display: block; margin-top: 5px; font-size: 11px; line-height: 1.6; color: var(--text-low); }
  .preset.on { border-color: rgba(217,192,138,.48); background: rgba(217,192,138,.1); }
  .preset.on b { color: var(--gold); }

  .advanced { margin-top: 20px; }
  .advanced summary { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-low); cursor: pointer; list-style: none; }
  .advanced summary::-webkit-details-marker { display: none; }
  .advanced summary::before { content: ""; width: 6px; height: 6px; border-right: 1px solid var(--text-low); border-bottom: 1px solid var(--text-low); transform: rotate(-45deg); }
  .advanced .fields { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .advanced .f { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-mid); }
  .advanced .f span { flex: 1; }
  .advanced .f em { font-style: normal; color: var(--text-low); font-size: 11.5px; }

  .actions { margin-top: 26px; display: flex; align-items: center; gap: 12px; }
  .actions .note { flex: 1; font-size: 11px; color: var(--text-low); line-height: 1.7; }
  .cancel { height: 44px; padding: 0 22px; border-radius: var(--r-pill); border: 1px solid var(--ink-line); background: transparent; color: var(--text-mid); font-size: 13px; cursor: pointer; }
  .go { display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 26px; border-radius: var(--r-pill); border: 1px solid rgba(217,192,138,.5); background: linear-gradient(160deg, rgba(217,192,138,.3), rgba(217,192,138,.12)); color: #f2e6c6; font-size: 14px; letter-spacing: .12em; cursor: pointer; }
  .go .icon { width: 17px; height: 17px; }
</style>
</head>
<body>
<div class="stage">
  <div id="scene"></div>
  <div class="wrap">
    <div class="panel create ctl">
      <div class="head"><h1 class="title">创造你的世界</h1><span>一句灵感，生成一座可以走进去的岛</span></div>
      <div class="grid">
        <div class="inspire">
          <svg viewBox="0 0 292 168">
            <defs><linearGradient id="isky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d6f7d"/><stop offset="1" stop-color="#a9bfa9"/></linearGradient></defs>
            <rect width="292" height="168" fill="url(#isky)"/>
            <circle cx="222" cy="42" r="42" fill="#f7e6bd" opacity=".5"/>
            <polygon points="20,120 96,64 176,80 246,126 168,148 70,146" fill="#6f9a72"/>
            <polygon points="96,64 176,80 150,104 76,100" fill="#87ac7c"/>
            <polygon points="70,146 168,148 246,126 240,140 166,162 76,158" fill="#8a8f6a"/>
            <g transform="translate(130,86) scale(.5)"><polygon points="-6,44 6,44 3,0 -3,0" fill="#6b5644"/><polygon points="-58,0 0,-52 58,0 30,10 -30,10" fill="#3f7a63"/></g>
            <g transform="translate(196,104) scale(.36)"><polygon points="-6,44 6,44 3,0 -3,0" fill="#6b5644"/><polygon points="-58,0 0,-52 58,0 30,10 -30,10" fill="#3f7a63"/></g>
            <rect y="120" width="292" height="48" fill="#dfe7d8" opacity=".22"/>
          </svg>
          <div class="body">
            <h3>晨雾群岛</h3>
            <p>缓丘、折伞树与会发光的灯菌溪谷。迷雾之外，还有五环未知的海。</p>
            <div class="palette"><i style="background:#87ac7c"></i><i style="background:#3f7a63"></i><i style="background:#8fd6c2"></i><i style="background:#cbb98f"></i><i style="background:#2a5b6b"></i></div>
            <div class="seed">种子 <code>MIST-7F3A-42</code><button class="icon-btn ctl" data-icon="sparkle"></button></div>
          </div>
        </div>
        <div class="form">
          <label class="lbl">世 界 灵 感</label>
          <div class="input"><span data-icon="sparkle"></span><span>有发光菌谷和缓丘的浮岛，清晨有薄雾</span><i class="caret"></i></div>

          <div style="height:20px"></div>
          <label class="lbl">预 设 风 格</label>
          <div class="presets">
            <button class="preset on ctl"><b>浮岛晨雾</b><small>缓丘与浅滩，光照柔和，适合初次探索</small></button>
            <button class="preset ctl"><b>湿地灯菌</b><small>浅水溪谷，夜间发光菌群与低垂雾气</small></button>
            <button class="preset ctl"><b>雪原高地</b><small>冷风台地，视野开阔，昼夜反差更强</small></button>
          </div>

          <div class="advanced">
            <details class="ctl">
              <summary>高级参数（地形、植被密度、迷雾厚度）</summary>
              <div class="fields">
                <div class="f"><span>主峰高度</span><em>18 BU</em></div>
                <div class="f"><span>植被密度</span><em>标准</em></div>
                <div class="f"><span>初始环数</span><em>1 环</em></div>
                <div class="f"><span>迷雾厚度</span><em>中等</em></div>
              </div>
            </details>
          </div>

          <div class="actions">
            <div class="note">生成在后台进行，完成后直接进入游戏；<br>期间可以继续探索当前世界。</div>
            <button class="cancel ctl">取消</button>
            <button class="go ctl"><span data-icon="leaf"></span> 生成世界</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  mountScene(document.getElementById('scene'), true);
  hydrateIcons();
</script>
</body>
</html>
