<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高保真 · 迷雾互动四态 · 桌面</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .quad { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cell { position: relative; overflow: hidden; border: 1px solid rgba(214,226,220,.1); }
  .cell .scene svg { width: 100%; height: 100%; }
  .cell .tag { position: absolute; top: 16px; left: 18px; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .14em; color: var(--text-mid); text-shadow: var(--shadow-text); }
  .cell .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cell .cap { position: absolute; left: 18px; bottom: 16px; font-size: 11.5px; color: var(--text-low); text-shadow: var(--shadow-text); }

  .fogwall { position: absolute; right: -4%; top: 0; bottom: 0; width: 46%; background: linear-gradient(90deg, rgba(223,231,216,0), rgba(223,231,216,.62)); }
  .fogwall.lift { background: linear-gradient(90deg, rgba(223,231,216,0), rgba(223,231,216,.18)); }

  .prompt { position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; border-radius: var(--r-pill); background: var(--ink-glass-soft); border: 1px solid var(--ink-line); backdrop-filter: var(--blur); white-space: nowrap; }
  .prompt .ring { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
  .prompt .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .prompt .ring .key { position: relative; min-width: 25px; height: 25px; }
  .prompt .txt b { display: block; font-size: 13.5px; font-weight: 500; }
  .prompt .txt small { display: block; margin-top: 2px; font-size: 11px; color: var(--text-low); }
  .prompt.fail { border-color: rgba(224,145,127,.4); }
  .prompt.fail .txt b { color: var(--danger); }
  .prompt.done { border-color: rgba(217,192,138,.45); }
  .prompt.done .txt b { color: var(--gold); }

  .anchor { position: absolute; left: 63%; top: 44%; width: 74px; height: 74px; margin: -37px; }
  .anchor svg { width: 100%; height: 100%; }
  .spark { position: absolute; left: 63%; top: 44%; width: 150px; height: 150px; margin: -75px; }
</style>
</head>
<body>
<div class="stage">
  <div class="quad">
    <div class="cell">
      <div class="scene"></div><div class="fogwall"></div>
      <div class="anchor"><svg viewBox="0 0 74 74" fill="none" stroke="#d9c08a" stroke-width="1.2"><circle cx="37" cy="37" r="26" stroke-dasharray="5 7" opacity=".85"/><circle cx="37" cy="37" r="15" opacity=".4"/></svg></div>
      <div class="tag"><i></i>1 · 接近</div>
      <div class="prompt ctl"><div class="ring"><span class="key">E</span></div><div class="txt"><b>触摸迷雾</b><small>按住开始蓄力</small></div></div>
      <div class="cap">对象锚点出现细线光环，提示输入图标与动作词。</div>
    </div>
    <div class="cell">
      <div class="scene"></div><div class="fogwall"></div>
      <div class="anchor"><svg viewBox="0 0 74 74" fill="none"><circle cx="37" cy="37" r="26" stroke="rgba(214,226,220,.2)" stroke-width="3"/><circle cx="37" cy="37" r="26" stroke="#d9c08a" stroke-width="3" stroke-dasharray="163.4" stroke-dashoffset="62" stroke-linecap="round" transform="rotate(-90 37 37)"/></svg></div>
      <div class="tag"><i></i>2 · 蓄力中</div>
      <div class="prompt ctl"><div class="ring"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="rgba(214,226,220,.2)" stroke-width="2"/><circle cx="20" cy="20" r="18" fill="none" stroke="#d9c08a" stroke-width="2" stroke-dasharray="113" stroke-dashoffset="40" stroke-linecap="round"/></svg><span class="key">E</span></div><div class="txt"><b>正在驱散迷雾…</b><small>62% · 松开取消</small></div></div>
      <div class="cap">环形进度沿锚点收拢，世界与角色仍可被看见。</div>
    </div>
    <div class="cell">
      <div class="scene"></div><div class="fogwall"></div>
      <div class="tag"><i style="background:var(--danger)"></i>3 · 取消 / 不可达</div>
      <div class="prompt fail ctl"><div class="ring"><span data-icon="close" style="display:grid;place-items:center;width:25px;height:25px;color:var(--danger)"></span></div><div class="txt"><b>已取消蓄力</b><small>距离过远时请先靠近迷雾边缘</small></div></div>
      <div class="cap">反馈说明原因，不阻塞移动，也不弹出模态框。</div>
    </div>
    <div class="cell">
      <div class="scene"></div><div class="fogwall lift"></div>
      <div class="spark"><svg viewBox="0 0 150 150" fill="#d9c08a"><circle cx="30" cy="46" r="2.4"/><circle cx="112" cy="38" r="2"/><circle cx="128" cy="92" r="2.6"/><circle cx="46" cy="118" r="2"/><circle cx="86" cy="20" r="1.8"/><circle cx="20" cy="88" r="1.8"/><circle cx="98" cy="126" r="2.2"/></svg></div>
      <div class="tag"><i style="background:var(--gold)"></i>4 · 完成</div>
      <div class="prompt done ctl"><div class="ring"><span data-icon="check" style="display:grid;place-items:center;width:25px;height:25px;color:var(--gold)"></span></div><div class="txt"><b>新区域已解锁 · 萤光林地</b><small>目标已更新，可继续向前探索</small></div></div>
      <div class="cap">雾面退散、金色粒子与目标更新，随后自动消退。</div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  document.querySelectorAll('.cell .scene').forEach(el => mountScene(el));
  hydrateIcons();
</script>
</body>
</html>
