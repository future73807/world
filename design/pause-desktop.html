<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高保真 · 暂停与设置 · 桌面</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .center { position: absolute; inset: 0; display: grid; place-items: center; }
  .menu { width: 452px; padding: 30px 32px 24px; }
  .menu .head { text-align: center; }
  .menu .head h1 { font-size: 25px; letter-spacing: .3em; text-indent: .3em; }
  .menu .head .sub { margin-top: 8px; font-size: 11.5px; color: var(--text-low); letter-spacing: .12em; }
  .menu .divider { margin: 20px 0; height: 1px; background: linear-gradient(90deg, transparent, var(--ink-line-strong), transparent); }

  .resume { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 50px; border-radius: var(--r-pill); border: 1px solid rgba(217,192,138,.5); background: linear-gradient(160deg, rgba(217,192,138,.28), rgba(217,192,138,.12)); color: #f2e6c6; font-size: 15px; letter-spacing: .18em; cursor: pointer; }
  .resume .icon { width: 18px; height: 18px; }
  .resume:hover { background: linear-gradient(160deg, rgba(217,192,138,.4), rgba(217,192,138,.18)); }

  .group-label { margin: 20px 0 10px; font-size: 11px; letter-spacing: .2em; color: var(--text-low); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid transparent; background: transparent; color: var(--text-mid); font-size: 12.5px; cursor: pointer; }
  .tab .icon { width: 16px; height: 16px; }
  .tab:hover { color: var(--text-hi); background: rgba(214,226,220,.06); }
  .tab.active { color: var(--gold); border-color: var(--gold-soft); background: rgba(217,192,138,.1); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .setting { margin-top: 16px; display: grid; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .row label { flex: 1; font-size: 13px; color: var(--text-mid); }
  .row label small { display: block; margin-top: 3px; font-size: 11px; color: var(--text-low); }
  .slider { position: relative; width: 150px; height: 4px; border-radius: 2px; background: rgba(214,226,220,.16); }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; border-radius: 2px; background: var(--accent); }
  .slider b { position: absolute; left: 62%; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: #eef6ef; transform: translate(-50%,-50%); box-shadow: 0 0 0 4px rgba(143,214,194,.18); }
  .row .val { width: 38px; text-align: right; font-size: 12px; color: var(--text-low); font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--ink-line); border-radius: var(--r-pill); overflow: hidden; }
  .seg button { height: 30px; padding: 0 13px; border: none; background: transparent; color: var(--text-low); font-size: 12px; cursor: pointer; }
  .seg button.on { background: rgba(143,214,194,.16); color: var(--accent); }
  .switch { position: relative; width: 42px; height: 23px; border-radius: 12px; background: rgba(214,226,220,.18); border: none; cursor: pointer; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #cfd6cc; transition: left var(--t-mid) var(--ease); }
  .switch.on { background: rgba(143,214,194,.34); }
  .switch.on i { left: 22px; background: var(--accent); }

  .danger { margin-top: 22px; padding-top: 16px; border-top: 1px dashed rgba(224,145,127,.28); display: flex; align-items: center; gap: 12px; }
  .danger span { flex: 1; font-size: 11.5px; color: var(--text-low); line-height: 1.6; }
  .danger button { height: 32px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid rgba(224,145,127,.4); background: transparent; color: var(--danger); font-size: 12px; cursor: pointer; }
  .foot { margin-top: 18px; text-align: center; font-size: 11px; color: var(--text-low); display: flex; gap: 6px; justify-content: center; align-items: center; }
</style>
</head>
<body>
<div class="stage">
  <div id="scene"></div>
  <div class="center">
    <div class="panel menu ctl">
      <div class="head">
        <h1 class="title">迷雾群岛</h1>
        <div class="sub">已 暂 停 · 晨 雾 浅 滩</div>
      </div>
      <div class="divider"></div>
      <button class="resume ctl"><span data-icon="play"></span> 继续游戏</button>

      <div class="group-label">设 置</div>
      <div class="tabs">
        <button class="tab ctl"><span data-icon="keyboard"></span> 操作</button>
        <button class="tab ctl active"><span data-icon="eye"></span> 镜头</button>
        <button class="tab ctl"><span data-icon="sparkle"></span> 画面</button>
        <button class="tab ctl"><span data-icon="sound"></span> 声音</button>
        <button class="tab ctl"><span data-icon="leaf"></span> 舒适性</button>
      </div>

      <div class="setting">
        <div class="row">
          <label>环视灵敏度<small>鼠标与触屏分别记忆</small></label>
          <div class="slider"><i></i><b></b></div><span class="val">1.2</span>
        </div>
        <div class="row">
          <label>默认跟随距离</label>
          <div class="seg"><button class="ctl">近</button><button class="ctl on">标准</button><button class="ctl">远</button></div>
        </div>
        <div class="row">
          <label>松鼠标自动回正<small>关闭后镜头保持当前朝向</small></label>
          <button class="switch ctl"><i></i></button>
        </div>
        <div class="row">
          <label>镜头遮挡自动避让</label>
          <button class="switch ctl on"><i></i></button>
        </div>
      </div>

      <div class="danger">
        <span>重新开始会清空当前世界进度，操作前需再次确认。</span>
        <button class="ctl">重置世界</button>
      </div>
      <div class="foot"><span class="key">Esc</span> 返回游戏</div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  mountScene(document.getElementById('scene'), true);
  hydrateIcons();
</script>
</body>
</html>
