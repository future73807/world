<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高保真 · 全屏地图 · 桌面</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .wrap { position: absolute; inset: 0; padding: 40px 56px 30px; display: flex; flex-direction: column; gap: 18px; }
  .bar-top { display: flex; align-items: center; gap: 16px; }
  .bar-top h1 { font-size: 25px; letter-spacing: .22em; text-shadow: var(--shadow-text); }
  .bar-top .sub { font-size: 12px; color: var(--text-low); letter-spacing: .08em; }
  .bar-top .spacer { flex: 1; }
  .ghost-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--ink-line); background: var(--ink-glass-soft); color: var(--text-mid); font-size: 12.5px; backdrop-filter: var(--blur); cursor: pointer; }
  .ghost-btn:hover { color: var(--gold); border-color: var(--gold-soft); }
  .ghost-btn .icon { width: 17px; height: 17px; }

  .map-body { position: relative; flex: 1; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--ink-line); box-shadow: var(--shadow-panel); }
  .map-body > svg { width: 100%; height: 100%; display: block; }
  .map-tools { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px; align-items: center; }
  .map-tools .zoom { display: grid; gap: 8px; }
  .scale { position: absolute; left: 22px; bottom: 22px; font-size: 11px; color: var(--text-mid); text-shadow: var(--shadow-text); }
  .scale i { display: block; width: 82px; height: 5px; margin-top: 5px; border: 1px solid var(--ink-line-strong); border-top: none; }

  .detail { position: absolute; left: 22px; top: 22px; width: 262px; padding: 18px; }
  .detail .kind { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .18em; color: var(--gold); }
  .detail .kind .icon { width: 15px; height: 15px; }
  .detail h3 { margin-top: 8px; font-family: var(--font-title); font-size: 20px; letter-spacing: .06em; }
  .detail p { margin-top: 9px; font-size: 12.5px; line-height: 1.75; color: var(--text-mid); }
  .detail .dist { margin-top: 12px; font-size: 11.5px; color: var(--text-low); display: flex; align-items: center; gap: 6px; }
  .detail .dist .icon { width: 14px; height: 14px; }
  .detail .actions { margin-top: 16px; display: grid; gap: 9px; }
  .primary { height: 40px; border-radius: var(--r-pill); border: 1px solid rgba(217,192,138,.5); background: linear-gradient(160deg, rgba(217,192,138,.26), rgba(217,192,138,.1)); color: #f0e3c4; font-size: 13px; letter-spacing: .08em; cursor: pointer; }
  .primary:hover { background: linear-gradient(160deg, rgba(217,192,138,.36), rgba(217,192,138,.16)); }
  .secondary { height: 36px; border-radius: var(--r-pill); border: 1px solid var(--ink-line); background: transparent; color: var(--text-low); font-size: 12px; cursor: pointer; }
  .secondary:hover { color: var(--text-hi); }
  .detail .x { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; }
  .detail .x .icon { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="stage">
  <div id="scene"></div>
  <div class="wrap">
    <div class="bar-top">
      <h1 class="title">世界地图</h1>
      <span class="sub">迷雾群岛 · 已解锁 1 / 6 环</span>
      <div class="spacer"></div>
      <button class="ghost-btn ctl"><span data-icon="sliders"></span> 图例与筛选</button>
      <button class="icon-btn ctl" data-icon="close"></button>
    </div>
    <div class="map-body ctl">
      <svg viewBox="0 0 1400 640" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="seaM" cx=".5" cy=".5" r=".72">
            <stop offset="0" stop-color="#23464f"/><stop offset="1" stop-color="#10282f"/>
          </radialGradient>
        </defs>
        <rect width="1400" height="640" fill="url(#seaM)"/>
        <g stroke="#7fa6a4" stroke-opacity=".12"><path d="M0 80h1400M0 200h1400M0 320h1400M0 440h1400M0 560h1400M140 0v640M340 0v640M540 0v640M740 0v640M940 0v640M1140 0v640"/></g>
        <circle cx="700" cy="320" r="238" fill="none" stroke="#dfe7d8" stroke-opacity=".16" stroke-dasharray="4 8"/>
        <circle cx="700" cy="320" r="150" fill="none" stroke="#dfe7d8" stroke-opacity=".1"/>
        <path d="M470 300 560 190 720 168 850 250 880 380 760 462 580 452 470 380Z" fill="#5f8a68"/>
        <path d="M560 190 720 168 700 300 560 320Z" fill="#7ba473"/>
        <path d="M700 300 850 250 880 380 760 462Z" fill="#4f7a5e"/>
        <path d="M470 300 470 380 452 372 442 316Z" fill="#cbb98f"/>
        <path d="M580 452 760 462 742 486 592 478Z" fill="#8a8f6a"/>
        <path d="M640 330 700 316 730 400 660 412Z" fill="#c9bd95" opacity=".55"/>
        <g opacity=".5" fill="#dfe7d8">
          <path d="M880 200c60-70 150-60 190 10s20 150-50 180-160-10-170-80 10-70 30-110Z" opacity=".16"/>
          <path d="M330 380c-40-60 10-140 90-150s150 50 140 120-90 130-160 100-50-30-70-70Z" opacity=".12"/>
        </g>
        <g stroke="#d9c08a" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity=".85">
          <path d="M660 396 Q700 340 742 300 T800 250"/>
        </g>
        <g transform="translate(800,250)">
          <circle r="17" fill="rgba(217,192,138,.16)"/><circle r="9" fill="none" stroke="#d9c08a" stroke-width="1.4"/>
          <path d="M0-5 3 3 0 1.4-3 3Z" fill="#d9c08a"/>
        </g>
        <g transform="translate(596,258)">
          <circle r="13" fill="rgba(143,214,194,.14)"/>
          <path d="M0-7 5 4 0 1.6-5 4Z" fill="#8fd6c2"/>
        </g>
        <g transform="translate(660,396) rotate(28)">
          <circle r="19" fill="rgba(244,239,226,.1)"/>
          <polygon points="0,-12 8,9 0,4 -8,9" fill="#f4efe2" stroke="#0f262d" stroke-width="1.2"/>
        </g>
        <g font-family="SimSun,serif" font-size="17" fill="#f4efe2" letter-spacing="3">
          <text x="596" y="152" text-anchor="middle">晨雾浅滩</text>
          <text x="1020" y="240" text-anchor="middle" fill="#93a5a3" font-size="14">未解锁海域</text>
        </g>
        <g font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#cfd6cc">
          <text x="800" y="285" text-anchor="middle">萤光林地</text>
          <text x="596" y="228" text-anchor="middle">折伞树丛</text>
        </g>
      </svg>

      <div class="panel detail ctl">
        <button class="icon-btn x ctl" data-icon="close"></button>
        <div class="kind"><span data-icon="flag"></span> 路径点</div>
        <h3>萤光林地</h3>
        <p>夜幕降临时，灯菌树会沿溪谷次第亮起。适合作为下一段拓荒的方向。</p>
        <div class="dist"><span data-icon="compass"></span> 东北 · 约 142 BU</div>
        <div class="actions">
          <button class="primary ctl">设为当前目标</button>
          <button class="secondary ctl">取消路径点</button>
        </div>
      </div>

      <div class="map-tools">
        <button class="ghost-btn ctl"><span data-icon="locate"></span> 回到玩家</button>
        <div class="zoom">
          <button class="icon-btn ctl" data-icon="plus"></button>
          <button class="icon-btn ctl" data-icon="minus"></button>
        </div>
      </div>
      <div class="scale">200 BU<i></i></div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  mountScene(document.getElementById('scene'), true);
  hydrateIcons();
</script>
</body>
</html>
