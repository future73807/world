<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>高保真 · 迷雾互动 · 触屏横屏</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .duo { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .half { position: relative; overflow: hidden; border-right: 1px solid rgba(214,226,220,.12); }
  .half .tag { position: absolute; top: 12px; left: 14px; font-size: 11px; letter-spacing: .14em; color: var(--text-mid); text-shadow: var(--shadow-text); }
  .fogwall { position: absolute; right: -4%; top: 0; bottom: 0; width: 46%; background: linear-gradient(90deg, rgba(223,231,216,0), rgba(223,231,216,.6)); }
  .fogwall.lift { background: linear-gradient(90deg, rgba(223,231,216,0), rgba(223,231,216,.16)); }
  .anchor { position: absolute; left: 60%; top: 42%; width: 62px; height: 62px; margin: -31px; }
  .anchor svg { width: 100%; height: 100%; }
  .prompt { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: var(--r-pill); background: var(--ink-glass-soft); border: 1px solid var(--ink-line); backdrop-filter: var(--blur); white-space: nowrap; }
  .prompt .txt b { display: block; font-size: 12.5px; font-weight: 500; }
  .prompt .txt small { display: block; margin-top: 2px; font-size: 10px; color: var(--text-low); }
  .prompt.done { border-color: rgba(217,192,138,.45); }
  .prompt.done .txt b { color: var(--gold); }
  .use { position: absolute; right: 26px; bottom: 86px; width: 84px; height: 84px; border-radius: 50%; border: 1px solid rgba(143,214,194,.45); background: var(--ink-glass-soft); backdrop-filter: var(--blur); display: grid; place-items: center; color: var(--accent); }
  .use svg.prog { position: absolute; inset: -5px; width: 94px; height: 94px; transform: rotate(-90deg); }
  .use .icon { width: 26px; height: 26px; }
  .use small { position: absolute; bottom: 12px; font-size: 9px; color: var(--text-mid); }
  .stick { position: absolute; left: 30px; bottom: 34px; width: 104px; height: 104px; border-radius: 50%; border: 1px solid rgba(226,236,228,.2); background: radial-gradient(circle, rgba(12,30,36,.3), rgba(12,30,36,.1)); }
</style>
</head>
<body>
<div class="stage">
  <div class="duo">
    <div class="half">
      <div class="scene"></div><div class="fogwall"></div>
      <div class="anchor"><svg viewBox="0 0 62 62" fill="none"><circle cx="31" cy="31" r="22" stroke="rgba(214,226,220,.2)" stroke-width="3"/><circle cx="31" cy="31" r="22" stroke="#d9c08a" stroke-width="3" stroke-dasharray="138.2" stroke-dashoffset="52" stroke-linecap="round" transform="rotate(-90 31 31)"/></svg></div>
      <div class="tag">蓄力中 · 触屏（按住互动键）</div>
      <div class="stick"></div>
      <button class="use ctl"><svg class="prog" viewBox="0 0 94 94"><circle cx="47" cy="47" r="44" fill="none" stroke="rgba(214,226,220,.16)" stroke-width="2"/><circle cx="47" cy="47" r="44" fill="none" stroke="#8fd6c2" stroke-width="2.5" stroke-dasharray="276.5" stroke-dashoffset="104" stroke-linecap="round"/></svg><span data-icon="hand"></span><small>按住</small></button>
      <div class="prompt ctl"><div class="txt"><b>正在驱散迷雾…</b><small>62% · 松开取消，不显示键帽</small></div></div>
    </div>
    <div class="half">
      <div class="scene"></div><div class="fogwall lift"></div>
      <div class="tag">完成 · 触屏</div>
      <button class="use ctl" style="border-color:rgba(217,192,138,.45);color:var(--gold)"><span data-icon="check"></span><small>完成</small></button>
      <div class="prompt done ctl"><div class="txt"><b>新区域已解锁 · 萤光林地</b><small>目标已更新，提示自动消退</small></div></div>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  document.querySelectorAll('.half .scene').forEach(el => mountScene(el));
  hydrateIcons();
</script>
</body>
</html>
